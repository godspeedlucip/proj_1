[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stent-repro"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch", "PyYAML", "tifffile", "scikit-image>=0.24"]

[project.optional-dependencies]
nerve = ["nibabel"]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
